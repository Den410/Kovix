services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_kovix
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=KovixStrongPass123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "KovixStrongPass123!", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./Movie.API
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=KovixDb;User Id=sa;Password=KovixStrongPass123!;TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Kovix
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend