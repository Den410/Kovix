stages:
  - build
  - test

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/
    - Kovix/node_modules/ # Виправлено шлях до node_modules

# --- БЕКЕНД (.NET) ---
backend_build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags: [student]
  script:
    - cd Movie.API   # Виправлено на реальну папку
    - dotnet restore
    - dotnet build --configuration Release --no-restore
  artifacts:
    paths: [Movie.API/bin/, Movie.API/obj/]
    expire_in: 1 hour

backend_test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags: [student]
  dependencies: [backend_build]
  script:
    - cd Movie.API   # Виправлено на реальну папку
    - dotnet test --configuration Release --no-build

# --- ФРОНТЕНД (React) ---
frontend_build:
  stage: build
  image: node:20
  tags: [student]
  script:
    - cd Kovix   # Виправлено на реальну папку
    - npm install
    - npm run build
  artifacts:
    paths: [Kovix/dist/]  
    expire_in: 1 hour

frontend_test:
  stage: test
  image: node:20
  tags: [student]
  dependencies: [frontend_build]
  script:
    - cd Kovix   # Виправлено на реальну папку
    - npm test -- --watchAll=false

# ── .NET: форматування коду ──
dotnet_format:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags: [student] # ДОДАНО ТЕГ
  script:
    - cd Movie.API
    - dotnet format --verify-no-changes
  allow_failure: true 

# ── React/Vite: ESLint ──
js_lint:
  stage: test
  image: node:20-alpine
  tags: [student] # ДОДАНО ТЕГ
  script:
    - cd Kovix
    - npm install
    - npm run lint
  allow_failure: true

# ── Перевірка NuGet пакетів для .NET ──
security_dotnet:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags: [student] # ДОДАНО ТЕГ
  script:
    - cd Movie.API
    - dotnet restore
    - dotnet list package --vulnerable --include-transitive
  allow_failure: true

# ── Перевірка npm пакетів для React ──
security_npm:
  stage: test
  image: node:20-alpine
  tags: [student] # ДОДАНО ТЕГ
  script:
    - cd Kovix
    - npm install
    - npm audit --audit-level=high
  allow_failure: true